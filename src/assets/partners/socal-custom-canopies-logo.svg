<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark fabric crosshatch texture -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22252a" />
      <stop offset="60%" stop-color="#14171a" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>
    <pattern id="carbonPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#141619" />
      <polygon points="0,0 3,0 0,3" fill="#1c2024" />
      <polygon points="3,3 6,3 3,6" fill="#1c2024" />
      <polygon points="3,0 6,0 6,3" fill="#0d0f11" />
      <polygon points="0,3 3,3 0,6" fill="#0d0f11" />
    </pattern>

    <!-- Rich Gold Foil Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3CD" />
      <stop offset="25%" stop-color="#E5C365" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="75%" stop-color="#F3DC8E" />
      <stop offset="100%" stop-color="#997015" />
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF0C2" />
      <stop offset="40%" stop-color="#D6AA38" />
      <stop offset="100%" stop-color="#8F6A14" />
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6E500C" />
      <stop offset="100%" stop-color="#4A3405" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="ribbonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Textured Background Plate -->
  <rect width="500" height="500" rx="16" fill="url(#bgRadial)" />
  <rect width="500" height="500" rx="16" fill="url(#carbonPattern)" opacity="0.6" />

  <!-- Outer Vignette -->
  <rect width="500" height="500" rx="16" fill="none" stroke="#2D333B" stroke-width="1.5" opacity="0.4" />

  <!-- Arced Top Text: "PRINT & SIGNS" -->
  <path id="textArc" d="M 90, 125 A 200,200 0 0,1 410, 125" fill="none" />
  <text font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-weight="800" font-size="25" fill="url(#goldSheen)" letter-spacing="9" filter="url(#goldGlow)">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      PRINT &amp; SIGNS
    </textPath>
  </text>

  <!-- Center Pop-Up Canopy Illustration -->
  <g transform="translate(0, 0)" filter="url(#goldGlow)">
    
    <!-- Canopy Roof Peak Frame -->
    <!-- Ridge Pyramid -->
    <polygon points="250,90 145,142 355,142" fill="none" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linejoin="round" />
    <line x1="250" y1="90" x2="250" y2="175" stroke="url(#goldSheen)" stroke-width="3.5" />
    <polygon points="250,90 145,142 250,175" fill="url(#goldSheen)" fill-opacity="0.12" />
    <polygon points="250,90 355,142 250,175" fill="url(#goldSheen)" fill-opacity="0.22" />

    <!-- Canopy Valance Base Horizontal Bar -->
    <line x1="145" y1="175" x2="355" y2="175" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" />
    <line x1="145" y1="142" x2="145" y2="175" stroke="url(#goldSheen)" stroke-width="3" />
    <line x1="355" y1="142" x2="355" y2="175" stroke="url(#goldSheen)" stroke-width="3" />

    <!-- 4 Canopy Legs -->
    <!-- Outer Left Leg -->
    <line x1="148" y1="175" x2="148" y2="270" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Inner Left Leg -->
    <line x1="234" y1="175" x2="234" y2="256" stroke="url(#goldSheen)" stroke-width="2.5" />
    <!-- Inner Right Leg -->
    <line x1="266" y1="175" x2="266" y2="256" stroke="url(#goldSheen)" stroke-width="2.5" />
    <!-- Outer Right Leg -->
    <line x1="352" y1="175" x2="352" y2="270" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Ground baseline curve under canopy -->
    <path d="M 125, 280 Q 250, 258 375, 280" fill="none" stroke="url(#goldSheen)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left Element: 5-Point Star -->
    <g transform="translate(190, 215) scale(0.9)">
      <polygon points="0,-16 5,-5 16,-4 8,4 10,15 0,9 -10,15 -8,4 -16,-4 -5,-5" fill="url(#goldSheen)" />
    </g>

    <!-- Right Element: Two Palm Trees on Island Curve -->
    <g transform="translate(305, 235)">
      <!-- Main Palm Tree Trunk -->
      <path d="M -10,25 Q -14,5 -5,-15 Q -1,-25 0,-30" fill="none" stroke="url(#goldSheen)" stroke-width="3.5" stroke-linecap="round" />
      <!-- Main Fronds -->
      <path d="M 0,-30 Q -16,-40 -25,-32" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 0,-30 Q -20,-24 -24,-15" fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 0,-30 Q 15,-40 24,-30" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 0,-30 Q 20,-22 22,-10" fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 0,-30 Q 0,-44 -2,-48" fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round" />

      <!-- Smaller Palm Tree Trunk (Behind/Left) -->
      <path d="M -22,25 Q -28,8 -20,-3 Q -16,-10 -15,-15" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -15,-15 Q -28,-22 -32,-16" fill="none" stroke="url(#goldSheen)" stroke-width="1.8" />
      <path d="M -15,-15 Q -5,-25 4,-20" fill="none" stroke="url(#goldSheen)" stroke-width="1.8" />
      <path d="M -15,-15 Q -14,-28 -16,-30" fill="none" stroke="url(#goldSheen)" stroke-width="1.8" />
    </g>
  </g>

  <!-- Large Bold Gold Typography: "SOCAL" -->
  <text x="250" y="365" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-weight="900" font-size="82" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="6" filter="url(#goldGlow)">
    SOCAL
  </text>

  <!-- Gold Ribbon Banner: "CUSTOM CANOPIES" -->
  <g transform="translate(0, 365)" filter="url(#ribbonShadow)">
    <!-- Ribbon Left Fishtail Fold -->
    <polygon points="85,38 125,24 125,58 85,72 102,55" fill="url(#goldDark)" />
    <polygon points="125,24 140,38 125,48" fill="#3D2903" />

    <!-- Ribbon Right Fishtail Fold -->
    <polygon points="415,38 375,24 375,58 415,72 398,55" fill="url(#goldDark)" />
    <polygon points="375,24 360,38 375,48" fill="#3D2903" />

    <!-- Main Curved Ribbon Front -->
    <path d="M 125,24 Q 250,42 375,24 L 375,58 Q 250,78 125,58 Z" fill="url(#goldRibbon)" stroke="url(#goldSheen)" stroke-width="1.5" />
    
    <!-- Ribbon Inner Border Line -->
    <path d="M 132,28 Q 250,45 368,28 M 132,54 Q 250,73 368,54" fill="none" stroke="#997015" stroke-width="1" />

    <!-- "CUSTOM CANOPIES" Bold Black Text in Ribbon -->
    <text x="250" y="52" font-family="'Cinzel', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#14171A" text-anchor="middle" letter-spacing="4">
      CUSTOM CANOPIES
    </text>
  </g>

  <!-- URL Bottom Tagline with Lines: "— SoCalcustomcanopies.com —" -->
  <g transform="translate(0, 458)">
    <line x1="110" y1="0" x2="145" y2="0" stroke="url(#goldSheen)" stroke-width="1.5" />
    <text x="250" y="5" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="14.5" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="1.5" filter="url(#goldGlow)">
      SoCalcustomcanopies.com
    </text>
    <line x1="355" y1="0" x2="390" y2="0" stroke="url(#goldSheen)" stroke-width="1.5" />
  </g>
</svg>
